spring:
  application:
    name: orderservice

  datasource:
  url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5434/order_db}
  username: ${ORDER_DB_USERNAME:postgres}
  password: ${ORDER_DB_PASSWORD:order_password}
  driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
