spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  kafka:
    listener:
      auto-startup: false
    admin:
      fail-fast: false

application:
  security:
    jwt:
      secret-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

  kafka:
    topics:
      order-created: order.created.test
      inventory-result: inventory.result.test
      inventory-result-dlt: inventory.result.test.dlt

logging:
  level:
    org.testcontainers: INFO
    com.orderservice: DEBUG